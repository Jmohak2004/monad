org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Ghar app config ----
# Web app the Android app opens. Override per build with -Pghar.url=... or in
# ~/.gradle/gradle.properties.
#  - Local dev on an emulator/phone: http://localhost:3000 plus
#    `adb reverse tcp:3000 tcp:3000` (localhost counts as a secure context, so passkeys work)
#  - Release: your deployed HTTPS origin, which must serve /.well-known/assetlinks.json
ghar.url=http://localhost:3000
# Play Store package name. Permanent once published.
ghar.applicationId=io.github.jmohak2004.ghar
