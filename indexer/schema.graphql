enum TransferStatus {
  PENDING
  CLAIMED
  REFUNDED
}

# One claim link. id is the link's claim-key address.
type Transfer {
  id: ID!
  sender: String! @index
  # Set once claimed.
  recipient: String @index
  amount: BigInt!
  expiry: BigInt!
  status: TransferStatus!
  createdAt: BigInt! @index
  createdTx: String!
  # When it was claimed or refunded.
  settledAt: BigInt
  settledTx: String
}

enum RequestStatus {
  PAID
  CANCELLED
}

# One settled payment request (QR). Open requests are off-chain until paid or
# cancelled. id is `${payee}-${requestId}`, since request ids are per payee.
type Request {
  id: ID!
  requestId: String!
  payee: String! @index
  # Set once paid.
  payer: String @index
  amount: BigInt
  status: RequestStatus!
  settledAt: BigInt! @index
  settledTx: String!
}

# Per-address totals, for the profile/summary view.
type Account {
  id: ID!
  sentCount: Int!
  sentTotal: BigInt!
  receivedCount: Int!
  receivedTotal: BigInt!
  refundedTotal: BigInt!
}
