# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: ghar-indexer
description: Ghar claim-link transfers (ClaimEscrow) on Monad
# Lowercase addresses so the app can query by `owner.toLowerCase()`.
address_format: lowercase
contracts:
  - name: ClaimEscrow
    events:
      - event: "Created(address indexed claimKey, address indexed sender, uint256 amount, uint40 expiry)"
      - event: "Claimed(address indexed claimKey, address indexed recipient, address indexed sender, uint256 amount)"
      - event: "Refunded(address indexed claimKey, address indexed sender, uint256 amount)"
  - name: PaymentRequest
    events:
      - event: "RequestPaid(bytes32 indexed id, address indexed payee, address indexed payer, uint256 amount)"
      - event: "RequestCancelled(bytes32 indexed id, address indexed payee)"
chains:
  - id: 10143 # Monad Testnet (HyperSync: https://10143.hypersync.xyz)
    # escrowDeployBlock from contracts/deployments/10143.json
    start_block: 70760893
    contracts:
      - name: ClaimEscrow
        address: "${ENVIO_ESCROW_ADDRESS}"
      - name: PaymentRequest
        address: "${ENVIO_REQUESTS_ADDRESS}"
